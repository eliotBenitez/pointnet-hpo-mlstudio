[package]
name = "mlstudio"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.9.0"
image = { version = "0.25", default-features = false }
notify-rust = "4"
serde_json = "1"
sysinfo = { version = "0.31.4", default-features = false, features = ["system"] }
trash = "5"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# Превью облака точек считается на CPU: без оптимизаций вращение в debug-сборке дёргается.
[profile.dev.package.mlstudio]
opt-level = 2

[target.'cfg(windows)'.dependencies]
# Уже в сборке через gpui; фичи — счётчики GPU (PDH) и список видеокарт (DXGI) для монитора ресурсов.
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_System_Performance"] }
