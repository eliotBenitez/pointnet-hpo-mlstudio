<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B22" />
      <stop offset="50%" stop-color="#0F1217" />
      <stop offset="100%" stop-color="#080A0D" />
    </linearGradient>

    <!-- Border highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FB27F" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#F5C04A" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1F242D" stop-opacity="0.4" />
    </linearGradient>

    <!-- Inner ambient glow -->
    <radialGradient id="centerGlow" cx="50%" cy="52%" r="45%">
      <stop offset="0%" stop-color="#3FB27F" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#2867A8" stop-opacity="0.12" />
      <stop offset="80%" stop-color="#0F1217" stop-opacity="0" />
    </radialGradient>

    <!-- Secondary warm glow -->
    <radialGradient id="amberGlow" cx="35%" cy="65%" r="35%">
      <stop offset="0%" stop-color="#F5C04A" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#F5C04A" stop-opacity="0" />
    </radialGradient>

    <!-- Point glow filters -->
    <filter id="glow-bright" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#centerGlow)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#amberGlow)" />
  
  <!-- Outer rim border -->
  <rect x="25" y="25" width="462" height="462" rx="107" fill="none" stroke="url(#rimGrad)" stroke-width="2.5" />

  <!-- 3D Perspective LiDAR Grid Floor -->
  <g opacity="0.22" stroke="#4B5563" stroke-width="1.2">
    <!-- Isometric perspective grid lines -->
    <path d="M 120 370 L 256 430 L 392 370" fill="none" />
    <path d="M 148 350 L 256 400 L 364 350" fill="none" />
    <path d="M 176 330 L 256 370 L 336 330" fill="none" />
    <path d="M 204 310 L 256 340 L 308 310" fill="none" />
    
    <path d="M 120 370 L 256 300 L 392 370" fill="none" stroke="#3FB27F" stroke-opacity="0.3" stroke-dasharray="3,3" />
    <path d="M 256 430 L 256 300" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-dasharray="2,2" />
  </g>

  <!-- Neural Edge Connections (PointNet++ Graph / k-NN) -->
  <g opacity="0.55" stroke-width="1.4">
    <!-- Primary structure links forming stylized 3D M and L -->
    <!-- Left pillar (M left) -->
    <line x1="145" y1="365" x2="160" y2="280" stroke="#F5C04A" opacity="0.6" />
    <line x1="160" y1="280" x2="175" y2="200" stroke="#38BDF8" opacity="0.7" />
    <line x1="175" y1="200" x2="185" y2="135" stroke="#3FB27F" opacity="0.85" />
    
    <!-- Central valley (M apex to center) -->
    <line x1="185" y1="135" x2="220" y2="215" stroke="#3FB27F" opacity="0.75" />
    <line x1="220" y1="215" x2="256" y2="270" stroke="#38BDF8" opacity="0.85" />
    <line x1="256" y1="270" x2="292" y2="215" stroke="#38BDF8" opacity="0.85" />
    <line x1="292" y1="215" x2="327" y2="135" stroke="#3FB27F" opacity="0.75" />

    <!-- Right pillar & diagonal (M right / L integration) -->
    <line x1="327" y1="135" x2="337" y2="200" stroke="#3FB27F" opacity="0.85" />
    <line x1="337" y1="200" x2="352" y2="280" stroke="#38BDF8" opacity="0.7" />
    <line x1="352" y1="280" x2="367" y2="365" stroke="#F5C04A" opacity="0.6" />

    <!-- Cross connections / spatial voxels -->
    <line x1="220" y1="215" x2="160" y2="280" stroke="#2867A8" opacity="0.4" stroke-dasharray="2,3" />
    <line x1="292" y1="215" x2="352" y2="280" stroke="#2867A8" opacity="0.4" stroke-dasharray="2,3" />
    <line x1="175" y1="200" x2="256" y2="270" stroke="#3FB27F" opacity="0.35" />
    <line x1="337" y1="200" x2="256" y2="270" stroke="#3FB27F" opacity="0.35" />
    <line x1="185" y1="135" x2="327" y2="135" stroke="#3FB27F" opacity="0.3" stroke-dasharray="3,3" />

    <!-- L base extension across ground -->
    <line x1="256" y1="270" x2="285" y2="335" stroke="#F5C04A" opacity="0.7" />
    <line x1="285" y1="335" x2="335" y2="370" stroke="#F5C04A" opacity="0.85" />
    <line x1="335" y1="370" x2="395" y2="360" stroke="#F5C04A" opacity="0.9" />
    <line x1="367" y1="365" x2="395" y2="360" stroke="#F5C04A" opacity="0.75" />
  </g>

  <!-- Point Cloud Nodes (LiDAR Classes) -->
  <!-- Class 1: Ground / Baseline Points (Warm Amber/Gold #F5C04A) -->
  <g id="ground-points">
    <circle cx="145" cy="365" r="5" fill="#F5C04A" />
    <circle cx="120" cy="370" r="3.5" fill="#D97706" opacity="0.7" />
    <circle cx="185" cy="385" r="3.5" fill="#D97706" opacity="0.75" />
    <circle cx="230" cy="365" r="4" fill="#F5C04A" opacity="0.8" />
    <circle cx="285" cy="335" r="5.5" fill="#F5C04A" />
    <circle cx="335" cy="370" r="6" fill="#F5C04A" />
    <circle cx="367" cy="365" r="5" fill="#F5C04A" />
    <circle cx="395" cy="360" r="6.5" fill="#F5C04A" filter="url(#glow-soft)" />
    <circle cx="410" cy="340" r="3" fill="#D97706" opacity="0.6" />
  </g>

  <!-- Class 2: Water / Spatial intermediate Points (Cyan / Blue #38BDF8 / #2867A8) -->
  <g id="water-points">
    <circle cx="160" cy="280" r="5.5" fill="#38BDF8" />
    <circle cx="210" cy="290" r="3.5" fill="#2867A8" opacity="0.8" />
    <circle cx="256" cy="270" r="7.5" fill="#38BDF8" filter="url(#glow-bright)" />
    <circle cx="302" cy="290" r="3.5" fill="#2867A8" opacity="0.8" />
    <circle cx="352" cy="280" r="5.5" fill="#38BDF8" />
    <circle cx="220" cy="215" r="6" fill="#38BDF8" />
    <circle cx="292" cy="215" r="6" fill="#38BDF8" />
  </g>

  <!-- Class 3: Building / Structure Points (Lavender / Indigo #A78BFA) -->
  <g id="building-points">
    <circle cx="175" cy="200" r="6" fill="#A78BFA" />
    <circle cx="337" cy="200" r="6" fill="#A78BFA" />
    <circle cx="205" cy="170" r="3.5" fill="#818CF8" opacity="0.7" />
    <circle cx="307" cy="170" r="3.5" fill="#818CF8" opacity="0.7" />
  </g>

  <!-- Class 4: Vegetation / High F1 Performance Points (Emerald #3FB27F & Crisp Core) -->
  <g id="vegetation-points">
    <!-- Secondary cluster ambient points -->
    <circle cx="155" cy="155" r="3.5" fill="#3FB27F" opacity="0.7" />
    <circle cx="170" cy="115" r="3" fill="#3FB27F" opacity="0.6" />
    <circle cx="342" cy="115" r="3" fill="#3FB27F" opacity="0.6" />
    <circle cx="357" cy="155" r="3.5" fill="#3FB27F" opacity="0.7" />

    <!-- Left Apex Peak -->
    <circle cx="185" cy="135" r="8" fill="#3FB27F" filter="url(#glow-bright)" />
    <circle cx="185" cy="135" r="4.5" fill="#E8FFF3" />

    <!-- Right Apex Peak -->
    <circle cx="327" cy="135" r="8" fill="#3FB27F" filter="url(#glow-bright)" />
    <circle cx="327" cy="135" r="4.5" fill="#E8FFF3" />

    <!-- Center High-F1 Champion Node -->
    <circle cx="256" cy="190" r="4" fill="#3FB27F" opacity="0.9" />
    <line x1="220" y1="215" x2="256" y2="190" stroke="#3FB27F" stroke-width="1.2" opacity="0.7" />
    <line x1="292" y1="215" x2="256" y2="190" stroke="#3FB27F" stroke-width="1.2" opacity="0.7" />
    <line x1="256" y1="190" x2="256" y2="270" stroke="#3FB27F" stroke-width="1.2" opacity="0.8" />
  </g>

  <!-- Central Star Sparkle / Apex F1 Indicator -->
  <g transform="translate(256, 190)" filter="url(#glow-bright)">
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="2.5" fill="#3FB27F" />
  </g>

  <!-- Class Noise / High Elevation Micro-particles (Scattered LiDAR Scan) -->
  <g opacity="0.65">
    <circle cx="130" cy="220" r="1.8" fill="#38BDF8" />
    <circle cx="140" cy="180" r="1.5" fill="#F5C04A" />
    <circle cx="215" cy="120" r="2" fill="#3FB27F" />
    <circle cx="297" cy="120" r="2" fill="#3FB27F" />
    <circle cx="372" cy="180" r="1.5" fill="#F5C04A" />
    <circle cx="382" cy="220" r="1.8" fill="#38BDF8" />
    <circle cx="256" cy="105" r="2.2" fill="#3FB27F" opacity="0.8" />
    <circle cx="256" cy="145" r="1.6" fill="#FFFFFF" />
  </g>
</svg>
